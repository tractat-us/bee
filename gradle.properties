kotlin.code.style=official
# Kotlin/Wasm incremental compilation OFF (kuilt #2849): an incremental wasm link after a
# test class is added writes a module V8 rejects, and the browser test hangs until Karma
# times out. Before removing this line, re-run kuilt #2849's probe on the new Kotlin.
kotlin.incremental.wasm=false
kotlin.daemon.jvmargs=-Xmx3g
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

# The Tigris Maven repository (TigrisKuilt in settings.gradle.kts) is reached through
# Gradle's native s3:// transport. The bucket sits in the endpoint subdomain because
# that transport forms path-style URLs when a custom endpoint is set (gradle/gradle#16638).
systemProp.org.gradle.s3.endpoint=https://buildcache.fly.storage.tigris.dev
systemProp.org.gradle.s3.maxErrorRetry=10
