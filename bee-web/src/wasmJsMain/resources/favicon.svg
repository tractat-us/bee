<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The bee mark. PageShell.kt draws the same shapes in the bar, in the page's accent colour; these are its values. -->
  <style>
    .bee { color: #b7791f; }
    @media (prefers-color-scheme: dark) { .bee { color: #e0a64a; } }
  </style>
  <defs>
    <mask id="stripes">
      <rect width="32" height="32" fill="#fff"/>
      <rect y="18.4" width="32" height="2.6" fill="#000"/>
      <rect y="23.6" width="32" height="2.6" fill="#000"/>
    </mask>
  </defs>
  <g class="bee" fill="currentColor" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14.4 7.6C13.6 5 12 3.6 9.6 3.2M17.6 7.6C18.4 5 20 3.6 22.4 3.2" fill="none" stroke-width="1.8"/>
    <ellipse cx="8.6" cy="12.6" rx="6" ry="3.6" transform="rotate(28 8.6 12.6)" fill-opacity="0.3" stroke-width="1.8"/>
    <ellipse cx="23.4" cy="12.6" rx="6" ry="3.6" transform="rotate(-28 23.4 12.6)" fill-opacity="0.3" stroke-width="1.8"/>
    <circle cx="16" cy="10" r="3" stroke="none"/>
    <ellipse cx="16" cy="21.6" rx="5.6" ry="7.6" mask="url(#stripes)" stroke="none"/>
  </g>
</svg>
