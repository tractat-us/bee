<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The bee mark. PageShell.kt draws the same shapes in the bar, in the page's accent colour; these are its values.
       Each wing is two quilt patches stitched together (kuilt). -->
  <style>
    .bee { color: #b7791f; }
    @media (prefers-color-scheme: dark) { .bee { color: #e0a64a; } }
  </style>
  <defs>
    <mask id="stripes">
      <rect width="32" height="32" fill="#fff"/>
      <path d="M8 18.2Q16 19.4 24 18.2V20.6Q16 21.8 8 20.6ZM8 23.2Q16 24.4 24 23.2V25.6Q16 26.8 8 25.6Z" fill="#000"/>
    </mask>
  </defs>
  <g class="bee" fill="currentColor" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14.4 7.6C13.6 5 12 3.6 9.6 3.2M17.6 7.6C18.4 5 20 3.6 22.4 3.2" fill="none" stroke-width="1.8"/>
    <g transform="translate(8.6 12.6) rotate(28)">
      <ellipse rx="6" ry="3.6" fill-opacity="0.25" stroke-width="1.8"/>
      <path d="M0-3.6A6 3.6 0 0 0 0 3.6Z" fill-opacity="0.3" stroke="none"/>
      <path d="M0-3.2V3.2" fill="none" stroke-width="0.8" stroke-dasharray="1.1 0.9"/>
    </g>
    <g transform="translate(23.4 12.6) rotate(-28)">
      <ellipse rx="6" ry="3.6" fill-opacity="0.25" stroke-width="1.8"/>
      <path d="M0-3.6A6 3.6 0 0 1 0 3.6Z" fill-opacity="0.3" stroke="none"/>
      <path d="M0-3.2V3.2" fill="none" stroke-width="0.8" stroke-dasharray="1.1 0.9"/>
    </g>
    <circle cx="16" cy="10" r="3" stroke="none"/>
    <ellipse cx="16" cy="21.6" rx="5.6" ry="7.6" mask="url(#stripes)" stroke="none"/>
  </g>
</svg>
