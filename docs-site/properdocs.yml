# The bee docs site. Build: docs-site/README.md.
site_name: bee docs
site_description: A shared, agent-drawn board for a team and their coding agents, built on kuilt.
site_url: https://potential-giggle-y9v4vm9.pages.github.io/
repo_url: https://github.com/tractat-us/bee
repo_name: tractat-us/bee
edit_uri: edit/main/docs/

docs_dir: ../docs
site_dir: site

# Agent instructions and session scratch are never rendered. They live at the
# repo root, outside docs_dir; these patterns keep them out wherever they appear.
# docs/project/ is the Project section, which needs the plan data it renders.
exclude_docs: |
  AGENTS.md
  CLAUDE.md
  next-plan*.md
  morning-report*.md
  /project/

# Rendered, so pages can link to its anchors, but kept out of the Docs nav.
not_in_nav: |
  /superpowers/plans/2026-11-06-bee-v1.md

hooks:
  - hooks.py

extra:
  # Pages rendered from outside docs/: site path → repo path. hooks.py adds them.
  outside_pages:
    index.md: README.md

extra_javascript:
  - javascripts/copy-markdown.js

theme:
  name: material
  # main.html adds the "View as Markdown" and "Copy page as Markdown" buttons.
  custom_dir: overrides
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tooltips
    - content.action.view
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: amber
      accent: brown
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: amber
      accent: brown
      toggle:
        icon: material/weather-sunny
        name: Light mode

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  # GitHub's heading slugs, so an anchor that works on GitHub works here.
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      # A language-* class on each block, so llms.txt keeps the fence's language.
      pygments_lang_class: true
  - pymdownx.inlinehilite
  # base_path resolves against the working directory, so every build runs from
  # the repo root. A missing include fails the build.
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
  # llms.txt, llms-full.txt, and a .md beside each listed page's index.html.
  # Sections mirror the nav tabs.
  - llmstxt:
      markdown_description: >-
        bee is at the design stage. The design, the setup guide for the MCP
        bridge, and the spike reports are below.
      full_output: llms-full.txt
      preprocess: llmstxt_preprocess.py
      sections:
        Docs:
          - index.md: What bee is
          - setup.md: Joining a Claude Code session to bee
          - superpowers/specs/2026-11-06-bee-design.md: The design
          - spikes/*.md

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    absolute_links: warn
    unrecognized_links: warn
    anchors: warn

nav:
  - Docs:
      - Home: index.md
      - Setup: setup.md
      - Design: superpowers/specs/2026-11-06-bee-design.md
      # bee and kuilt: a page another change adds goes here.
      - Spikes:
          - Renderer glue: spikes/2026-11-spike-1-renderer-glue.md
          - A CRDT behind A2UI: spikes/2026-11-spike-2-crdt-behind-a2ui.md
          - Bridge mechanics: spikes/2026-11-spike-3-bridge-mechanics.md
          - Claims: spikes/2026-11-spike-4-claims.md
