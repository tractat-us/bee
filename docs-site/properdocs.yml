# The bee docs site. Build: docs-site/README.md.
site_name: bee docs
site_description: A shared, agent-drawn board for a team and their coding agents, built on kuilt.
site_url: https://tractat-us.github.io/bee/
repo_url: https://github.com/tractat-us/bee
repo_name: tractat-us/bee
edit_uri: edit/main/docs/

docs_dir: ../docs
site_dir: site

# Agent instructions and session scratch are never rendered. They live at the
# repo root, outside docs_dir; these patterns keep them out wherever they appear.
exclude_docs: |
  AGENTS.md
  CLAUDE.md
  next-plan*.md
  morning-report*.md

# plan_pages.py renders the Project section from docs/project/plan.yaml. It runs
# first, so hooks.py sees the links it writes.
hooks:
  - plan_pages.py
  - hooks.py
  # A description per page, from its first paragraph (seo.py).
  - seo.py

extra:
  # The homepage's <title> and link-preview title, after site_name (overrides/main.html).
  home_title: a shared, agent-drawn board for a team and their coding agents
  # Pages rendered from outside docs/: site path → repo path. hooks.py adds them.
  outside_pages:
    index.md: README.md

extra_javascript:
  - javascripts/copy-markdown.js

extra_css:
  - stylesheets/copy-markdown.css

theme:
  name: material
  # main.html adds the "View as Markdown" and "Copy page as Markdown" buttons.
  custom_dir: overrides
  logo: assets/bee.svg
  favicon: assets/bee.svg
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tooltips
    - content.action.view
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: amber
      accent: brown
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: amber
      accent: brown
      toggle:
        icon: material/weather-sunny
        name: Light mode

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  # GitHub's heading slugs, so an anchor that works on GitHub works here.
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      # A language-* class on each block, so llms.txt keeps the fence's language.
      pygments_lang_class: true
  - pymdownx.inlinehilite
  # base_path resolves against the working directory, so every build runs from
  # the repo root. A missing include fails the build.
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
  # llms.txt, llms-full.txt, and a .md beside each listed page's index.html.
  # Sections mirror the nav tabs.
  - llmstxt:
      markdown_description: >-
        The pages below cover what bee is, how to run a board or join one from
        Claude Code or Codex, the tools and prompts a session gets, its design, and what
        each spike found.
      full_output: llms-full.txt
      preprocess: llmstxt_preprocess.py
      sections:
        Docs:
          - index.md: What bee is, and the three ways onto a board
          - try-bee.md: Joining a board, or running your own, in a few minutes, from a Mac
          - demo.md: A five-minute script for showing bee to a colleague, two laptops and a phone
          - setup.md: Running a board with bee-up, joining one from its link, and adding bee to Claude Code
          - tools.md: Every tool and prompt a Claude session gets from bee, one line each
          - plugin.md: The Claude Code plugin, which joins a session to a board with one install
          - codex.md: Joining a board from Codex, with one line for the board and the same skills Claude Code gets
          - deploy.md: Running hosted bee at bee.tractat.us, from getting on the board to deploying its one Fly.io machine
          - dogfood.md: bee's own development board on your Mac, drawn from the plan, the morning report and the open decisions
          - superpowers/specs/2026-11-06-bee-design.md: The design spec, with its goals, architecture and the board's state
          - bee-and-kuilt.md: What bee builds and what it takes from kuilt
          - architecture/README.md: The living architecture docs, and how a design decision changes them
          - architecture/product.md: What a person meets in bee, and its first principle, a physical, infinite whiteboard with no clutter
          - architecture/access.md: Who may write to a board, and how a host makes someone a host or evicts them
          - spikes/2026-11-spike-1-renderer-glue.md: Spike 1, Kotlin/wasm driving the stock A2UI renderer
          - spikes/2026-11-spike-2-crdt-behind-a2ui.md: Spike 2, two browsers editing one surface through a CRDT
          - spikes/2026-11-spike-3-bridge-mechanics.md: Spike 3a, the bridge surviving /clear, the /clear hook, and bounded waits
          - spikes/2026-11-spike-4-claims.md: Spike 4, exactly-once claims through one durable voter
        Project:
          - project/index.md: Where bee stands, and what waits on Iain
          - project/timeline.md: Started, landed, and estimates for open work
          - project/dependencies.md: What waits on what
          - project/decisions.md: Questions for Iain and his rulings
          - project/kuilt.md: kuilt work bee depends on
          - superpowers/plans/2026-11-06-bee-v1.md: The v1 plan
          - project/schema.md: The plan's data format

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    absolute_links: warn
    unrecognized_links: warn
    anchors: warn

nav:
  - Docs:
      - Home: index.md
      - Try bee: try-bee.md
      - Demo walkthrough: demo.md
      - Setup: setup.md
      - Tools and prompts: tools.md
      - Claude Code plugin: plugin.md
      - bee with Codex: codex.md
      - Hosted bee: deploy.md
      - bee's own board: dogfood.md
      - Design: superpowers/specs/2026-11-06-bee-design.md
      - bee and kuilt: bee-and-kuilt.md
      - Architecture:
          - architecture/README.md
          - Product: architecture/product.md
          - Access: architecture/access.md
      - Spikes:
          - Renderer glue: spikes/2026-11-spike-1-renderer-glue.md
          - A CRDT behind A2UI: spikes/2026-11-spike-2-crdt-behind-a2ui.md
          - Bridge mechanics: spikes/2026-11-spike-3-bridge-mechanics.md
          - Claims: spikes/2026-11-spike-4-claims.md
  # Rendered from docs/project/plan.yaml by plan_pages.py.
  - Project:
      - Overview: project/index.md
      - Timeline: project/timeline.md
      - Dependencies: project/dependencies.md
      - Decisions: project/decisions.md
      - kuilt work: project/kuilt.md
      - The v1 plan: superpowers/plans/2026-11-06-bee-v1.md
      - Data format: project/schema.md
