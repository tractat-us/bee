# The docs site: docs-site/properdocs.yml over docs/, published to GitHub Pages
# at https://tractat-us.github.io/bee/.
# Build and preview: docs-site/README.md.
#
# A PR that touches the site gets a strict build as its check; a push to main
# builds and deploys. Neither is a required check, and ci.yml's detect counts
# this file and docs-site/ as docs-class, so the site never buys the Gradle build.
# The repo is private, so minutes are billed: ubuntu-latest, a timeout on every job.
name: Docs site

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "docs-site/**"
      - "README.md"
      - ".github/workflows/docs-site.yml"
  pull_request:
    paths:
      - "docs/**"
      - "docs-site/**"
      - "README.md"
      - ".github/workflows/docs-site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-site-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: docs-site/requirements.txt

      - name: Install ProperDocs and its plugins
        run: pip install -r docs-site/requirements.txt

      # From the repo root: pymdownx.snippets resolves includes against the working
      # directory. --strict fails on a broken link or anchor; hooks.py turns links to
      # files outside the site into GitHub links first, so only real breaks remain.
      - name: Build (strict)
        env:
          DISABLE_MKDOCS_2_WARNING: "true"
        run: properdocs build --strict -f docs-site/properdocs.yml

      - name: Upload the site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs-site/site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: docs-site-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
