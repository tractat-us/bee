# The bee project plan, as data. Schema: plan.schema.json, beside this file.
#
# The docs site's Project section renders from this file, and a bee board can later
# be seeded from it (bee#21). Keep it plain JSON in YAML form: no anchors, no tags,
# every timestamp a quoted UTC string. `items` is keyed by stable id and each item is
# replaced whole on write; `order` lists every id once. The markdown plan
# (docs/superpowers/plans/2026-11-06-bee-v1.md) stays the source of truth for what
# each task is; this file tracks where each one stands.
#
# Estimates are ranges, labelled as estimates, with their basis. They measure
# wall-clock time from start to merge and leave out time waiting on Iain.

