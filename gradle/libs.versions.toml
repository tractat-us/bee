[versions]
# Kotlin, coroutines, serialization and atomicfu follow the kuilt pin below (758a0fe6b).
kotlin = "2.4.20"
# Ktor runs ahead of kuilt (3.5.2) until tractat-us/kuilt#3150: 3.6.1 sends a WebSocket's last
# frame, such as the host's 1009, before the connection closes (KTOR-9987 Netty, KTOR-10035
# WebSockets; bee#58). ktor-bom aligns kuilt's Ktor modules to this version.
ktor = "3.6.1"
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.12.0"
atomicfu = "0.33.0"
kotlinLogging = "8.0.6"
logback = "1.6.6"
# kuilt publish run 1696, kuilt commit 758a0fe6b: kuilt#3136 (CausalMap), on #3132 (LatticeDotFun).
kuilt = "0.7.0-dev.1696"
mcp = "0.16.0"
kotlinx-browser = "0.5.0"
# The bee app (#156): Compose Multiplatform and the Android Gradle plugin, at fireworks-compose's pins.
composeMultiplatform = "1.11.1"
agp = "8.13.2"
# 37: kuilt-websocket's Android variant takes Ktor's OkHttp engine, whose okhttp-android 5.5.1 needs it.
android-compileSdk = "37"
android-minSdk = "26"
androidx-activity = "1.13.0"

[libraries]
kuilt-bom = { module = "us.tractat.kuilt:kuilt-bom", version.ref = "kuilt" }
kuilt-crdt = { module = "us.tractat.kuilt:kuilt-crdt" }
kuilt-quilter = { module = "us.tractat.kuilt:kuilt-quilter" }
kuilt-websocket = { module = "us.tractat.kuilt:kuilt-websocket" }
kuilt-gossip = { module = "us.tractat.kuilt:kuilt-gossip" }
kuilt-cluster = { module = "us.tractat.kuilt:kuilt-cluster" }
kuilt-raft = { module = "us.tractat.kuilt:kuilt-raft" }
kuilt-liveness = { module = "us.tractat.kuilt:kuilt-liveness" }
kuilt-store = { module = "us.tractat.kuilt:kuilt-store" }
kuilt-test = { module = "us.tractat.kuilt:kuilt-test" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-serialization-cbor = { module = "org.jetbrains.kotlinx:kotlinx-serialization-cbor", version.ref = "kotlinx-serialization" }
kotlinx-atomicfu = { module = "org.jetbrains.kotlinx:atomicfu", version.ref = "atomicfu" }
kotlinx-browser = { module = "org.jetbrains.kotlinx:kotlinx-browser", version.ref = "kotlinx-browser" }
kotlin-logging = { module = "io.github.oshai:kotlin-logging", version.ref = "kotlinLogging" }
logback = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

ktor-bom = { module = "io.ktor:ktor-bom", version.ref = "ktor" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-js = { module = "io.ktor:ktor-client-js", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-websockets = { module = "io.ktor:ktor-client-websockets", version.ref = "ktor" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-server-websockets = { module = "io.ktor:ktor-server-websockets", version.ref = "ktor" }
ktor-server-sse = { module = "io.ktor:ktor-server-sse", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }

mcp-kotlin-sdk-server = { module = "io.modelcontextprotocol:kotlin-sdk-server", version.ref = "mcp" }
# Test-only: an in-process SDK client drives the bridge's tools (Task 5).
mcp-kotlin-sdk-client = { module = "io.modelcontextprotocol:kotlin-sdk-client", version.ref = "mcp" }

compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
compose-ui-test = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "composeMultiplatform" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }

[plugins]
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
androidApplication = { id = "com.android.application", version.ref = "agp" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
